name: Update Contribution Snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: AryanExE-x
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=00ff66&color_dots=#101712,#06351b,#08752f,#00b84a,#00ff66

      - name: Commit updated animation
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: refresh contribution matrix"
          add: "assets/github-contribution-grid-snake.svg"
