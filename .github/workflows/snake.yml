name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: AryanExE-x
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=00ff66

      - name: Commit generated asset
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake"
          add: "assets/github-contribution-grid-snake.svg"
