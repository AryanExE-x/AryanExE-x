<svg width="1600" height="70" viewBox="0 0 1600 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pathFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff5" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00fff5" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#ff00c8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff00c8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shipGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="70" fill="transparent"/>
  <line x1="0" y1="35" x2="1600" y2="35" stroke="url(#pathFade)" stroke-width="1.5" stroke-dasharray="6 10"/>

  <g filter="url(#shipGlow)">
    <path d="M0,0 L18,0 L26,7 L18,14 L0,14 L5,7 Z" fill="#8fe9ff">
      <animateMotion path="M -30,35 L 1630,35" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle r="2.5" fill="#ff00c8" opacity="0.9">
    <animateMotion path="M 1630,35 L -30,35" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="13s" repeatCount="indefinite"/>
  </circle>
</svg>
