<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sweepGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#00fff5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00fff5" stop-opacity="0"/>
    </radialGradient>
    <filter id="g3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="320" height="320" fill="transparent"/>

  <g transform="translate(160,160)">
    <circle r="130" fill="none" stroke="#00fff5" stroke-width="1" opacity="0.25"/>
    <circle r="95" fill="none" stroke="#00fff5" stroke-width="1" opacity="0.25"/>
    <circle r="60" fill="none" stroke="#00fff5" stroke-width="1" opacity="0.25"/>
    <circle r="25" fill="none" stroke="#00fff5" stroke-width="1" opacity="0.25"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#00fff5" stroke-width="1" opacity="0.15"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#00fff5" stroke-width="1" opacity="0.15"/>

    <g>
      <path d="M0,0 L130,0 A130,130 0 0,0 92,-92 Z" fill="url(#sweepGrad)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <circle r="4" fill="#ff00c8" filter="url(#g3)" cx="55" cy="-40">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#ffce54" filter="url(#g3)" cx="-70" cy="30">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8fe9ff" filter="url(#g3)" cx="20" cy="80">
      <animate attributeName="opacity" values="0;1;1;0;0;0" dur="3.5s" begin="2.1s" repeatCount="indefinite"/>
    </circle>

    <circle r="3" fill="#00fff5" filter="url(#g3)"/>
  </g>
</svg>
