<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="planetGrad2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c9a6ff"/>
      <stop offset="45%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#1b1035"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="100%" stop-color="#00c2d1"/>
    </radialGradient>
    <filter id="g2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="320" height="320" fill="transparent"/>

  <g stroke="#ffffff" opacity="0.5">
    <circle cx="30" cy="40" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="30" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="280" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="270" r="1.3"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(160,160)">
    <ellipse rx="130" ry="46" fill="none" stroke="#00fff5" stroke-width="1.3" opacity="0.4"/>
    <ellipse rx="130" ry="46" fill="none" stroke="#00fff5" stroke-width="1" opacity="0.15" transform="rotate(55)"/>

    <circle r="55" fill="url(#planetGrad2)" filter="url(#g2)"/>
    <circle r="55" fill="none" stroke="#e0c3ff" stroke-width="1" opacity="0.5"/>

    <circle r="9" fill="url(#moonGrad)" filter="url(#g2)">
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M 130,0 A 130,46 0 1,1 -130,0 A 130,46 0 1,1 130,0"/>
    </circle>

    <g transform="rotate(55)">
      <circle r="5" fill="#ff00c8" opacity="0.85">
        <animateMotion dur="8s" repeatCount="indefinite" begin="1.2s"
          path="M 130,0 A 130,46 0 1,1 -130,0 A 130,46 0 1,1 130,0"/>
      </circle>
    </g>
  </g>
</svg>
