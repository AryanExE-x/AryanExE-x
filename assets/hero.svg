<svg width="1600" height="340" viewBox="0 0 1600 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#140a2b"/>
      <stop offset="55%" stop-color="#0a0716"/>
      <stop offset="100%" stop-color="#020103"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff5"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00c8"/>
      <stop offset="100%" stop-color="#9b00ff"/>
    </linearGradient>
    <radialGradient id="planetGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7de3ff"/>
      <stop offset="45%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#1b1035"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="340" fill="url(#bgGrad)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="30" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="120" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="60" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="230" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="280" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="30" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="110" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="250" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="50" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.5s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="150" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="280" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="70" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.7s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="200" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="40" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="290" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="120" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="170" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.35s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="200" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting stars -->
  <g stroke="#8fe9ff" stroke-width="2" stroke-linecap="round" opacity="0">
    <line x1="0" y1="0" x2="70" y2="20">
      <animateMotion path="M -100,20 L 500,140" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="60" y2="16">
      <animateMotion path="M -100,180 L 450,60" dur="4.2s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="2.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- orbiting planet, top right -->
  <g transform="translate(1370,110)">
    <ellipse cx="0" cy="0" rx="150" ry="20" fill="none" stroke="#00fff5" stroke-width="1.4" opacity="0.35" transform="rotate(-18)"/>
    <circle cx="0" cy="0" r="62" fill="url(#planetGrad)"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#00fff5" stroke-width="1" opacity="0.4"/>
    <g>
      <circle r="7" fill="#ff00c8" filter="url(#softGlow)">
        <animateMotion dur="7s" repeatCount="indefinite"
          path="M 150,0 A 150,20 -18 1,1 -150,0 A 150,20 -18 1,1 150,0"/>
      </circle>
    </g>
  </g>

  <!-- HUD divider line -->
  <line x1="70" y1="290" x2="1120" y2="290" stroke="#00fff5" stroke-width="1.2" opacity="0.35"/>
  <circle cx="70" cy="290" r="3" fill="#00fff5" opacity="0.7"/>
  <circle cx="1120" cy="290" r="3" fill="#00fff5" opacity="0.7"/>

  <!-- title text -->
  <text x="80" y="150" font-family="Consolas, 'Courier New', monospace" font-size="66" font-weight="700" fill="url(#neonCyan)" filter="url(#glow)">ARYAN PRASAD</text>
  <text x="82" y="192" font-family="Consolas, 'Courier New', monospace" font-size="21" fill="url(#neonMagenta)" filter="url(#softGlow)">// FULL-STACK + DSA UNIT — VADODARA, GUJARAT</text>
  <text x="82" y="228" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#8fe9ff">
    STATUS:
    <tspan fill="#ffce54"> 404_MOTIVATION_NOT_FOUND</tspan>
  </text>
  <rect x="400" y="215" width="10" height="18" fill="#ffce54">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
